<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
      <nav>
        <div class="nav-left">
            <img src="Assests/Images/Logo.png" alt="" height="50px" width="50px">
            <h2>FlavorFind</h2>
        </div>
        <div class="nav-center">
            <div class="searchbar">
                <input type="text" placeholder="Search Recipe">
                <button><i class="fa-brands fa-sistrix"></i> Search</button>
            </div>
        </div>
        <div class="nav-right">
            <button>
                <i class="fa-regular fa-pen-to-square"></i>
                <span>ADD RECIPE</span>
            </button>
            <button>
                <i class="fa-regular fa-bookmark"></i>
                <span>BOOKMARKS</span>
            </button>
        </div>
    </nav>

    <main>
        <section class="left-navigation">
            <div class="left-navigation-top-sec">
                <span>Pizza</span>
                <span>Burger</span>
                <span>Steak</span>
                <span>Pasta</span>
                <span>Biryani</span>
            </div>
            <div class="left-navigation-list"></div>
        </section>
        <section class="right-display"></section>
    </main>
  </div>
    <script src="app.js"></script>

</body>

</html>
